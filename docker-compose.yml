services:
  app:
    image: slack2mail-app:latest
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - TZ=Asia/Tokyo
    expose:
      - "3000"
    # ポートをhostにpublishする必要はない(cloudflaredが同一ネットワーク経由で叩く)

  cloudflared:
    image: cloudflare/cloudflared:latest
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
    env_file:
      - .env
    command: tunnel --no-autoupdate run
    depends_on:
      - app
